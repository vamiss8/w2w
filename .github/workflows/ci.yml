# every pull request, and every push to main, goes through the same three
# checks as a local npm test in tests/: lint over the site, the sql replayed
# on pglite, and the site driven in chromium against a stand-in for supabase.
# nothing here reaches the real database, and nothing here deploys: cloudflare
# pages does that on its own.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# the job only reads the repo
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run db
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7
